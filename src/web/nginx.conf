# Lumen Goods storefront: serves the Angular build and proxies the API.
# Runs in nginx/nginx-unprivileged (non-root, so it listens on 8080). The Dockerfile copies this
# file to /etc/nginx/conf.d/default.conf, which the image's nginx.conf includes inside `http {}`.

# Angular fingerprints every bundle (main-<hash>.js, chunk-<hash>.js, styles-<hash>.css,
# bundled-media/*), so those are cached for a year. Everything else, index.html above all,
# is revalidated on each load so a new release is picked up at once. An empty value sends no
# header: the API sets its own caching.
map $uri $lumen_cache_control {
    default                                          "no-cache";
    ~^/(?:main|polyfills|styles|chunk)-[^/]+\.(?:js|css)$  "public, max-age=31536000, immutable";
    ~^/bundled-media/                                "public, max-age=31536000, immutable";
    ~^/(?:api|media)/                                "";
}

# DNS rebinding: a page on an attacker's domain re-pointed to 127.0.0.1 would otherwise reach the
# shop and its API as its own origin, so its scripts could read every answer. Any Host other than
# the ones below gets no answer at all (444 closes the connection). The API checks the Host too
# (AllowedHosts in docker-compose.yml).
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    # The container healthcheck (Dockerfile) asks for 127.0.0.1; browsers and CI use localhost.
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/problem+json application/xml image/svg+xml;

    # Declared once at server level: an add_header inside a location would drop all of these.
    # Cache-Control has no `always`: an error (a 404 for a stale chunk) must not be cached a year.
    add_header Cache-Control $lumen_cache_control;
    # Scripts are covered by the hash-based CSP that Angular's autoCsp writes into index.html;
    # this header adds the rest. Both policies apply. 'unsafe-inline' styles: Angular and
    # Material inject component styles at runtime.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Docker's embedded DNS. Resolving the API per request (via the variable below) lets nginx
    # start before the api container and follow it when it restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lumen_api http://api:8080;

    # Regex locations match in file order, so this one wins over the static-file rule below.
    location ~ ^/(?:api|media)/ {
        proxy_pass $lumen_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the edge: overwrite, never append to, a client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        # A mock card payment can take about 20 s; leave headroom.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing bundle must 404: falling back to index.html would be parsed as JavaScript.
    location ~* \.(?:js|mjs|css|map|json|txt|ico|png|jpe?g|gif|svg|webp|avif|woff2?)$ {
        try_files $uri =404;
    }

    # Client-side routes (/cart, /orders/42, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
