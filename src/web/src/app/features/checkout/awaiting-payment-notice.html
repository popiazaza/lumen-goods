@if (awaiting(); as order) {
  <div class="banner" role="status">
    <mat-icon svgIcon="info" aria-hidden="true" />
    <div>
      <p>
        <strong>Order {{ order.number }} is waiting for payment</strong>
      </p>
      <p>
        Its items are held for that order until
        <time [attr.datetime]="order.holdExpiresUtc">{{
          order.holdExpiresUtc | date: 'shortTime'
        }}</time>, so they may show as out of stock here.
      </p>
      <a matButton="filled" routerLink="/checkout/payment" [queryParams]="{ order: order.number }"
        >Continue to payment</a
      >
    </div>
  </div>
}
