<form class="code-form" novalidate [formGroup]="form()" (ngSubmit)="verify.emit()">
  <div class="field">
    <label hlmLabel for="one-time-code">Verification code</label>
    <input
      id="one-time-code"
      hlmInput
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      formControlName="code"
      required
      [aria-describedby]="describedBy()"
      [aria-invalid]="!!error()"
      [forceInvalid]="!!error()"
    />
    @if (testCode(); as code) {
      <p id="code-test" class="hint">Test code: {{ code }} (no text message is sent)</p>
    }
  </div>
  @if (error()) {
    <p id="code-error" class="field-error" role="alert">
      <ng-icon name="lucideCircleAlert" />
      {{ error() }}
    </p>
  }
  <p id="code-timer" class="timer" role="timer">
    <ng-icon name="lucideClock" />
    Code expires in {{ countdown() }}
  </p>
  <div class="actions">
    <button hlmBtn type="submit" [attr.aria-disabled]="submitting()">
      {{ submitting() ? 'Verifying…' : 'Verify' }}
    </button>
  </div>
</form>
