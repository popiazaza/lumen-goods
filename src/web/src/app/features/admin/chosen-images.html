<ol class="chosen">
  @for (file of files(); track file) {
    <li>
      @if (imageUrls().get(file); as url) {
        <img alt="" width="64" height="64" [ngSrc]="url" />
      } @else {
        <span class="no-thumbnail"></span>
      }
      <span class="file">{{ file }}</span>
      @if ($first) {
        <span class="main"><ng-icon name="lucideStar" />Main image</span>
      } @else {
        <button
          hlmBtn
          variant="outline"
          size="sm"
          type="button"
          [attr.aria-label]="`Make ${file} the main image`"
          (click)="mainChosen.emit(file)"
        >
          Make main
        </button>
      }
      <button
        hlmBtn
        variant="ghost"
        size="sm"
        type="button"
        [attr.aria-label]="`Remove ${file}`"
        (click)="removed.emit(file)"
      >
        Remove
      </button>
    </li>
  }
</ol>
