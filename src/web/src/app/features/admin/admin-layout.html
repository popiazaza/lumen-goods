<nav class="sections" aria-label="Admin sections">
  <ul>
    @for (section of sections; track section.path) {
      <li>
        <a routerLinkActive="active" ariaCurrentWhenActive="page" [routerLink]="section.path">
          {{ section.label }}
        </a>
      </li>
    }
  </ul>
</nav>

<router-outlet />
