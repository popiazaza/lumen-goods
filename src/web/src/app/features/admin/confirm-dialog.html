<div hlmDialogHeader>
  <h2 hlmDialogTitle>{{ data.title }}</h2>
  <p hlmDialogDescription class="message">{{ data.message }}</p>
</div>
@if (data.noteLabel) {
  <div class="field">
    <label hlmLabel for="confirm-note">{{ data.noteLabel }}</label>
    <textarea
      id="confirm-note"
      hlmTextarea
      rows="3"
      [formControl]="note"
      [maxlength]="noteMaxLength"
      [aria-describedby]="
        noteError() ? 'confirm-note-error' : data.noteHint ? 'confirm-note-hint' : null
      "
    ></textarea>
    @if (noteError()) {
      <p id="confirm-note-error" class="field-error">At most {{ noteMaxLength }} characters.</p>
    } @else if (data.noteHint) {
      <p id="confirm-note-hint" class="hint">{{ data.noteHint }}</p>
    }
  </div>
}
<div hlmDialogFooter>
  <button hlmBtn variant="outline" type="button" class="cancel" (click)="cancel()">
    {{ data.cancelText }}
  </button>
  <button hlmBtn type="button" class="confirm" (click)="confirm()">
    {{ data.confirmText }}
  </button>
</div>
