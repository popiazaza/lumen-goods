<fieldset>
  <legend>Category</legend>
  @for (category of categories; track category) {
    <label hlmLabel class="option">
      <hlm-checkbox
        [checked]="query().categories.includes(category)"
        (checkedChange)="toggleCategory(category, $event)"
      />
      {{ categoryLabel(category) }}
    </label>
  }
</fieldset>

<fieldset>
  <legend>Seller</legend>
  @for (seller of sellers(); track seller.source) {
    <label hlmLabel class="option">
      <hlm-checkbox
        [checked]="query().sellers.includes(seller.source)"
        (checkedChange)="toggleSeller(seller.source, $event)"
      />
      {{ seller.name }}
    </label>
  }
  @if (sellersFailed()) {
    <p class="note">The seller list couldn’t be loaded.</p>
  }
</fieldset>

<fieldset>
  <legend>Price (USD)</legend>
  <form class="price-range" novalidate [formGroup]="priceForm" (ngSubmit)="applyPrice()">
    <div class="field">
      <label hlmLabel [for]="ids().min">Min</label>
      <div class="money">
        <span class="currency" aria-hidden="true">$</span>
        <input
          hlmInput
          formControlName="min"
          inputmode="decimal"
          autocomplete="off"
          [id]="ids().min"
          [attr.aria-invalid]="minError() ? 'true' : null"
          [attr.aria-describedby]="minError() ? ids().minError : null"
        />
      </div>
      @if (minError(); as message) {
        <p class="field-error" [id]="ids().minError">{{ message }}</p>
      }
    </div>
    <div class="field">
      <label hlmLabel [for]="ids().max">Max</label>
      <div class="money">
        <span class="currency" aria-hidden="true">$</span>
        <input
          hlmInput
          formControlName="max"
          inputmode="decimal"
          autocomplete="off"
          [id]="ids().max"
          [attr.aria-invalid]="maxError() ? 'true' : null"
          [attr.aria-describedby]="maxError() ? ids().maxError : null"
        />
      </div>
      @if (maxError(); as message) {
        <p class="field-error" [id]="ids().maxError">{{ message }}</p>
      }
    </div>
    <button hlmBtn variant="outline" type="submit">Apply price</button>
  </form>
</fieldset>

<label hlmLabel class="option switch">
  <hlm-switch [checked]="query().inStock" (checkedChange)="setInStock($event)" />
  In stock only
</label>
