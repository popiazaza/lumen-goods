<div class="summary" role="alert" tabindex="-1">
  <h2 class="title">
    <ng-icon name="lucideCircleAlert" />
    {{ heading() }}
  </h2>
  <ul>
    @for (problem of problems(); track problem.fieldId) {
      <li>
        <a [attr.href]="`#${problem.fieldId}`" (click)="focusField($event, problem.fieldId)">{{
          problem.message
        }}</a>
      </li>
    }
  </ul>
</div>
