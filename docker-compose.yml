# One command runs everything: docker compose up --build
# Storefront: http://localhost:8080  (API docs: http://localhost:8080/api/docs)
# Partner sandboxes for inspection: Harbor http://localhost:8081, Kestrel http://localhost:8082
# Published ports bind to 127.0.0.1 only: the demo accounts have published passwords.
# The compose project name is the folder's name, so two checkouts don't share containers or volumes (a second one
# running at the same time needs its own ports and LUMEN_NETWORK_PREFIX, see .env.example).

x-tcp-healthcheck: &tcp-healthcheck
  # The .NET runtime images have bash but no curl; a TCP connect proves Kestrel (the web server) is listening.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
  interval: 3s
  timeout: 3s
  retries: 30

services:
  db:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen-dev-password}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data as before).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Lumen.Api/Dockerfile
    environment:
      ConnectionStrings__Lumen: Host=db;Database=lumen;Username=lumen;Password=${POSTGRES_PASSWORD:-lumen-dev-password}
      # nginx forwards the browser's Host, and only serves these two (DNS rebinding); the healthcheck below sends localhost.
      AllowedHosts: "localhost;127.0.0.1"
      # X-Forwarded-For is believed from the web (nginx) container only, at its fixed address below. A request from any
      # other peer is rate limited by that peer's own address, whatever X-Forwarded-For it sends.
      ForwardedHeaders__KnownProxies__0: ${LUMEN_NETWORK_PREFIX:-172.16.87}.10
      # Plain HTTP on localhost; production behind TLS keeps the default (Always).
      Auth__CookieSecurePolicy: SameAsRequest
      # Keys for the session cookie and XSRF tokens, on a volume: sign-ins survive a restart or a rebuilt container.
      DataProtection__KeysPath: /app/keys
      Docs__Enabled: "true"
      # Demo accounts listed in the README; off in the base (production) configuration.
      Seed__Enabled: "true"
      Logging__Console__FormatterName: json
      # Partner sandboxes on the compose network. Point these at any other implementation of the partner contracts.
      Partners__Harbor__BaseUrl: ${HARBOR_BASE_URL:-http://harbor:8080}
      Partners__Harbor__ApiKey: ${HARBOR_API_KEY:-harbor-dev-key-123}
      Partners__Kestrel__BaseUrl: ${KESTREL_BASE_URL:-http://kestrel:8080}
      Partners__Kestrel__Username: ${KESTREL_USERNAME:-lumen}
      Partners__Kestrel__Password: ${KESTREL_PASSWORD:-kestrel-secret}
      # OpenTelemetry: traces, metrics and logs go over OTLP only when this is set. With the "observability" profile,
      # set it to http://aspire-dashboard:18889 (see .env.example). Empty by default: nothing is exported.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Metrics every 10 s instead of the SDK's 60 s, so the dashboard's charts move during a demo.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    volumes:
      - api-keys:/app/keys
    healthcheck:
      # Healthy only once migrations and seeding are done and the database answers (/health).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      db:
        condition: service_healthy
      harbor:
        condition: service_started
      kestrel:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: src/web
    networks:
      default:
        # The one address the API takes X-Forwarded-For from (ForwardedHeaders__KnownProxies__0 above).
        ipv4_address: ${LUMEN_NETWORK_PREFIX:-172.16.87}.10
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  harbor:
    build:
      context: .
      dockerfile: src/StandIns/HarborSupply.StandIn/Dockerfile
    ports:
      - "127.0.0.1:${HARBOR_PORT:-8081}:8080"
    volumes:
      - harbor-data:/app/data
    healthcheck: *tcp-healthcheck
    restart: unless-stopped

  kestrel:
    build:
      context: .
      dockerfile: src/StandIns/KestrelOutfitters.StandIn/Dockerfile
    ports:
      - "127.0.0.1:${KESTREL_PORT:-8082}:8080"
    volumes:
      - kestrel-data:/app/data
    healthcheck: *tcp-healthcheck
    restart: unless-stopped

  # Optional, local only: "docker compose --profile observability up" adds the Aspire dashboard
  # (http://localhost:18888) for the API's traces, metrics and logs. The API sends them only when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 is set (OTLP over gRPC on the compose network).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    profiles: [observability]
    environment:
      # Unsecured and anonymous on purpose: no login for the UI, the OTLP endpoint or the telemetry API. Acceptable
      # only because the UI binds to 127.0.0.1 and OTLP is not published; never expose this container as it is.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18888}:18888"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so nginx can have a fixed address. Outside Docker's default address pools (172.17-31.x, 192.168.x), so
        # no other compose project is given it. If a VPN or another checkout uses it, set LUMEN_NETWORK_PREFIX (the first
        # three numbers of a free /24, see .env.example): subnet, nginx's address and the API's trusted proxy all follow.
        # The other containers get addresses from ip_range only, so none can take nginx's before it starts.
        - subnet: ${LUMEN_NETWORK_PREFIX:-172.16.87}.0/24
          ip_range: ${LUMEN_NETWORK_PREFIX:-172.16.87}.128/25

volumes:
  db-data:
  api-keys:
  harbor-data:
  kestrel-data:
